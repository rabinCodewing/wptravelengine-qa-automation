<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add-on QA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@400;500&display=swap">
<script>
  try { const t = localStorage.getItem("addonQa.theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
</script>
<style>
  /* ── Tokens ─────────────────────────────────────────────────────────────
     Paper tinted toward WPTE teal (hue ~185). Ink-teal for action; signal
     colours (pass / fail / moving) are the only saturated hues on the page. */
  :root {
    color-scheme: light;
    --paper: oklch(97.2% 0.008 185);
    --paper-2: oklch(94.6% 0.012 185);
    --sheet: oklch(99.2% 0.004 185);
    --rule: oklch(88% 0.014 185);
    --rule-soft: oklch(92.5% 0.01 185);
    --ink: oklch(23% 0.03 200);
    --ink-2: oklch(38% 0.025 200);
    --ink-3: oklch(54% 0.02 200);
    --brand: oklch(47% 0.09 182);
    --brand-ink: oklch(98.5% 0.01 182);
    --brand-wash: oklch(93% 0.035 182);
    --pass: oklch(55% 0.13 150);
    --pass-wash: oklch(94% 0.045 150);
    --fail: oklch(56% 0.19 32);
    --fail-wash: oklch(95% 0.035 32);
    --move: oklch(70% 0.15 75);
    --move-wash: oklch(95.5% 0.05 85);
    --idle: oklch(78% 0.012 200);
    --term: oklch(21% 0.02 205);
    --term-2: oklch(26% 0.022 205);
    --term-ink: oklch(90% 0.012 185);
    --term-dim: oklch(64% 0.02 195);
    --term-pass: oklch(80% 0.13 150);
    --term-fail: oklch(76% 0.15 32);
    --term-move: oklch(84% 0.12 85);
    --term-link: oklch(82% 0.08 210);

    --display: "Bricolage Grotesque", "Instrument Sans", ui-sans-serif, system-ui, sans-serif;
    --body: "Instrument Sans", ui-sans-serif, system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, monospace;

    --ease: cubic-bezier(.22, 1, .36, 1);
    --index-w: 296px;
    --gap: clamp(16px, 2.2vw, 32px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --paper: oklch(19.5% 0.014 200); --paper-2: oklch(23% 0.016 200); --sheet: oklch(21.5% 0.015 200);
      --rule: oklch(32% 0.018 200); --rule-soft: oklch(27% 0.016 200);
      --ink: oklch(94% 0.01 185); --ink-2: oklch(80% 0.015 190); --ink-3: oklch(64% 0.018 195);
      --brand: oklch(72% 0.11 182); --brand-ink: oklch(18% 0.03 190); --brand-wash: oklch(30% 0.05 182);
      --pass: oklch(76% 0.14 150); --pass-wash: oklch(30% 0.06 150);
      --fail: oklch(72% 0.16 32); --fail-wash: oklch(31% 0.07 32);
      --move: oklch(82% 0.13 80); --move-wash: oklch(32% 0.06 80); --idle: oklch(42% 0.015 200);
      --term: oklch(15% 0.014 205); --term-2: oklch(19% 0.016 205);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: oklch(19.5% 0.014 200); --paper-2: oklch(23% 0.016 200); --sheet: oklch(21.5% 0.015 200);
    --rule: oklch(32% 0.018 200); --rule-soft: oklch(27% 0.016 200);
    --ink: oklch(94% 0.01 185); --ink-2: oklch(80% 0.015 190); --ink-3: oklch(64% 0.018 195);
    --brand: oklch(72% 0.11 182); --brand-ink: oklch(18% 0.03 190); --brand-wash: oklch(30% 0.05 182);
    --pass: oklch(76% 0.14 150); --pass-wash: oklch(30% 0.06 150);
    --fail: oklch(72% 0.16 32); --fail-wash: oklch(31% 0.07 32);
    --move: oklch(82% 0.13 80); --move-wash: oklch(32% 0.06 80); --idle: oklch(42% 0.015 200);
    --term: oklch(15% 0.014 205); --term-2: oklch(19% 0.016 205);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--paper); color: var(--ink); font: 15px/1.55 var(--body); -webkit-font-smoothing: antialiased; }
  h1, h2, h3, h4, p { margin: 0; }
  a { color: var(--brand); text-underline-offset: 3px; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 4px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  /* ── Frame ─────────────────────────────────────────────────────────────── */
  .frame { display: grid; grid-template-columns: var(--index-w) minmax(0, 1fr); min-height: 100vh; }

  /* ── Index (left) ──────────────────────────────────────────────────────── */
  .index { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; border-right: 1px solid var(--rule); background: var(--paper-2); }
  .masthead { padding: 22px 20px 16px; }
  .wordmark { display: flex; align-items: baseline; gap: 8px; }
  .wordmark b { font: 800 22px/1 var(--display); letter-spacing: -.03em; }
  .wordmark span { font: 600 11px/1 var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
  .site { margin-top: 10px; display: inline-flex; align-items: center; gap: 7px; font: 12.5px var(--mono); color: var(--ink-2); text-decoration: none; max-width: 100%; }
  .site span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .site:hover { color: var(--brand); }
  .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--idle); flex: none; }
  .pulse.on { background: var(--pass); }
  .pulse.warn { background: var(--move); }

  .coverage { padding: 0 20px 14px; }
  .coverage p { font-size: 12.5px; color: var(--ink-2); }
  .coverage p b { font-family: var(--display); font-size: 15px; color: var(--ink); }
  .coverage-bar { margin-top: 8px; display: grid; grid-auto-flow: column; gap: 2px; height: 5px; }
  .coverage-bar i { border-radius: 2px; background: var(--rule); }
  .coverage-bar i.auto { background: var(--brand); }
  .coverage-bar i.auto.failed { background: var(--fail); }

  .search { margin: 0 14px 10px; position: relative; }
  .search input { width: 100%; padding: 9px 12px 9px 34px; border-radius: 9px; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); font: 14px var(--body); }
  .search input::placeholder { color: var(--ink-3); }
  .search input:focus { outline: 2px solid var(--brand); outline-offset: -1px; }
  .search svg { position: absolute; left: 11px; top: 50%; translate: 0 -50%; width: 15px; height: 15px; stroke: var(--ink-3); fill: none; stroke-width: 2; }
  .filters { display: flex; gap: 4px; padding: 0 14px 10px; }
  .filters button { border: 1px solid transparent; background: none; padding: 4px 10px; border-radius: 999px; font-size: 12.5px; color: var(--ink-2); cursor: pointer; }
  .filters button[aria-pressed="true"] { background: var(--sheet); border-color: var(--rule); color: var(--ink); font-weight: 600; }

  .catalog { flex: 1; overflow-y: auto; padding: 4px 8px 16px; scrollbar-width: thin; scrollbar-color: var(--rule) transparent; }
  .cat-group { margin-top: 14px; }
  .cat-group h3 { padding: 0 12px 6px; font: 600 11px/1 var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); display: flex; justify-content: space-between; }
  .addon-link { width: 100%; display: grid; grid-template-columns: 12px minmax(0, 1fr); gap: 10px; align-items: start; padding: 8px 12px; border: 0; background: none; border-radius: 8px; text-align: left; cursor: pointer; text-decoration: none; color: var(--ink); }
  .addon-link:hover { background: var(--sheet); }
  .addon-link[aria-current="page"] { background: var(--sheet); box-shadow: inset 0 0 0 1px var(--rule); }
  .addon-link .nm { font-weight: 600; font-size: 14px; line-height: 1.3; display: block; }
  .addon-link .mt { display: block; font-size: 12px; color: var(--ink-3); margin-top: 1px; }
  .addon-link.dim .nm { font-weight: 500; color: var(--ink-2); }
  .mark { margin-top: 5px; width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--idle); }
  .mark.passed { background: var(--pass); border-color: var(--pass); }
  .mark.failed { background: var(--fail); border-color: var(--fail); }
  .mark.running { border-color: var(--move); background: var(--move); animation: beat 1.1s var(--ease) infinite; }
  .mark.none { border-style: dashed; }
  @keyframes beat { 50% { opacity: .35; } }

  .index-foot { padding: 12px 14px; border-top: 1px solid var(--rule); display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  .theme { display: inline-flex; padding: 2px; border-radius: 8px; background: var(--paper); border: 1px solid var(--rule); }
  .theme button { border: 0; background: none; padding: 4px 9px; font-size: 12px; border-radius: 6px; cursor: pointer; color: var(--ink-3); }
  .theme button[aria-pressed="true"] { background: var(--sheet); color: var(--ink); box-shadow: 0 1px 0 var(--rule); }
  .foot-link { font-size: 12.5px; color: var(--ink-2); text-decoration: none; }
  .foot-link:hover { color: var(--brand); }

  /* ── Stage (right) ─────────────────────────────────────────────────────── */
  .stage { min-width: 0; display: flex; flex-direction: column; }
  .busy-strip { display: flex; align-items: center; gap: 12px; padding: 9px var(--gap); background: var(--move-wash); color: var(--ink); font-size: 13.5px; border-bottom: 1px solid color-mix(in oklch, var(--move) 40%, transparent); }
  .busy-strip[hidden] { display: none; }
  .busy-strip a { font-weight: 600; }

  .head { padding: clamp(24px, 3.4vw, 44px) var(--gap) 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px 28px; align-items: end; }
  .eyebrow { font: 600 11.5px/1 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--brand); }
  .head h1 { margin-top: 10px; font: 800 clamp(34px, 4.6vw, 60px)/.95 var(--display); letter-spacing: -.035em; }
  .head .lede { margin-top: 12px; max-width: 58ch; color: var(--ink-2); font-size: 15.5px; }
  .facts { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 22px; padding-top: 4px; font-size: 13px; color: var(--ink-3); }
  .facts b { color: var(--ink); font-weight: 600; }
  .facts code { font: 12px var(--mono); color: var(--ink-2); }

  .launch { display: grid; gap: 10px; justify-items: end; }
  .launch-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .btn { border: 1px solid var(--rule); background: var(--sheet); padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer; transition: background-color .2s var(--ease), border-color .2s var(--ease), transform .15s var(--ease); white-space: nowrap; }
  .btn:hover:not(:disabled) { border-color: var(--ink-3); }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.go { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); padding: 11px 20px; font-size: 15px; display: inline-flex; gap: 9px; align-items: center; }
  .btn.go:hover:not(:disabled) { background: color-mix(in oklch, var(--brand) 88%, var(--ink)); }
  .btn.go svg { width: 13px; height: 13px; fill: currentColor; }
  .btn.stop { color: var(--fail); border-color: color-mix(in oklch, var(--fail) 45%, transparent); }
  .switches { display: flex; gap: 14px; flex-wrap: wrap; justify-content: flex-end; }
  .sw { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); cursor: pointer; user-select: none; }
  .sw input { appearance: none; width: 28px; height: 16px; border-radius: 999px; background: var(--rule); position: relative; cursor: pointer; margin: 0; transition: background-color .2s var(--ease); flex: none; }
  .sw input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--sheet); transition: transform .2s var(--ease); box-shadow: 0 1px 2px rgb(0 0 0 / .2); }
  .sw input:checked { background: var(--brand); }
  .sw input:checked::after { transform: translateX(12px); }
  .sw input:disabled { opacity: .5; }

  .tabs { margin-top: clamp(22px, 3vw, 34px); padding: 0 var(--gap); display: flex; gap: 26px; border-bottom: 1px solid var(--rule); overflow-x: auto; scrollbar-width: none; }
  .tab { border: 0; background: none; padding: 0 0 12px; font-weight: 600; font-size: 14.5px; color: var(--ink-3); cursor: pointer; position: relative; white-space: nowrap; display: inline-flex; gap: 7px; align-items: center; }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { color: var(--ink); }
  .tab[aria-selected="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--ink); border-radius: 2px; }
  .tab .n { font: 600 11px var(--body); padding: 1px 7px; border-radius: 999px; background: var(--paper-2); color: var(--ink-2); }
  .tab .n.bad { background: var(--fail-wash); color: var(--fail); }
  .tab .n.live { background: var(--move-wash); color: var(--ink); }

  .panel { padding: clamp(20px, 2.6vw, 32px) var(--gap) 56px; animation: rise .45s var(--ease); }
  .panel[hidden] { display: none; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }

  /* ── Features (test plan) ──────────────────────────────────────────────── */
  .plan-tools { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; font-size: 13px; color: var(--ink-3); }
  .plan-tools button { border: 0; background: none; padding: 0; color: var(--ink-2); cursor: pointer; font-size: 13px; text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 4px; }
  .plan-tools button:hover { color: var(--brand); text-decoration-color: currentColor; }
  .plan-tools .sel { margin-left: auto; color: var(--ink); font-weight: 600; }

  .legs { display: grid; gap: clamp(26px, 3vw, 40px); }
  .leg { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 0 18px; }
  .leg-no { font: 800 44px/1 var(--display); color: var(--rule); letter-spacing: -.04em; text-align: right; padding-top: 2px; font-variant-numeric: tabular-nums; }
  .leg-head { display: flex; align-items: center; gap: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
  .leg-head h2 { font: 700 20px/1.2 var(--display); letter-spacing: -.015em; }
  .leg-head .tally { font-size: 12.5px; color: var(--ink-3); }
  .leg-head label { margin-left: auto; font-size: 12.5px; color: var(--ink-2); display: inline-flex; gap: 7px; align-items: center; cursor: pointer; }
  .leg ol { list-style: none; margin: 0; padding: 0; }
  .stop-row { display: grid; grid-template-columns: 18px 14px minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 10px 4px; border-bottom: 1px solid var(--rule-soft); }
  .stop-row:hover { background: color-mix(in oklch, var(--sheet) 70%, transparent); }
  .stop-row input, .leg-head input { accent-color: var(--brand); width: 15px; height: 15px; margin: 0; }
  .stop-row .t { font-size: 14.5px; color: var(--ink); min-width: 0; }
  .stop-row .d { font: 12px var(--body); color: var(--ink-3); font-variant-numeric: tabular-nums; min-width: 48px; text-align: right; }
  .stop-row .solo { opacity: 0; border: 1px solid var(--rule); background: var(--sheet); border-radius: 7px; padding: 3px 9px; font-size: 12px; font-weight: 600; cursor: pointer; transition: opacity .15s; }
  .stop-row:hover .solo, .stop-row .solo:focus-visible { opacity: 1; }
  .stop-row .solo:disabled { display: none; }
  .glyph { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--idle); }
  .glyph.passed { background: var(--pass); border-color: var(--pass); }
  .glyph.failed { background: var(--fail); border-color: var(--fail); }
  .glyph.running { background: var(--move); border-color: var(--move); animation: beat 1.1s var(--ease) infinite; }
  .glyph.skipped { border-style: dashed; }

  /* ── Run: route + live dock ────────────────────────────────────────────── */
  .run-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(340px, 44%); gap: var(--gap); align-items: start; }
  .run-summary { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 24px; margin-bottom: 22px; }
  .run-summary .big { font: 800 clamp(26px, 3vw, 38px)/1 var(--display); letter-spacing: -.03em; }
  .run-summary .big.passed { color: var(--pass); } .run-summary .big.failed { color: var(--fail); } .run-summary .big.running { color: var(--ink); }
  .run-summary .figs { display: flex; gap: 18px; font-size: 13.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .run-summary .figs b { color: var(--ink); font-weight: 650; }
  .run-summary .figs .p b { color: var(--pass); } .run-summary .figs .f b { color: var(--fail); }
  .progress { height: 3px; background: var(--rule-soft); border-radius: 3px; overflow: hidden; margin: -10px 0 26px; }
  .progress i { display: block; height: 100%; background: var(--brand); width: 0; transition: width .6s var(--ease); }

  .route { position: relative; }
  .route-leg { position: relative; padding-left: 34px; }
  .route-leg + .route-leg { margin-top: 22px; }
  .route-leg::before { content: ""; position: absolute; left: 10px; top: 8px; bottom: -22px; width: 2px; background: var(--rule); }
  .route-leg:last-child::before { bottom: 12px; }
  .route-leg h3 { font: 600 11.5px/1 var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); margin: 2px 0 10px; position: relative; }
  .route-leg h3::before { content: ""; position: absolute; left: -29px; top: -2px; width: 12px; height: 12px; border-radius: 3px; background: var(--paper); border: 2px solid var(--rule); }
  .halt { position: relative; margin-bottom: 6px; }
  .halt::before { content: ""; position: absolute; left: -29px; top: 15px; width: 12px; height: 12px; border-radius: 50%; background: var(--paper); border: 2px solid var(--idle); z-index: 1; transition: background-color .3s, border-color .3s; }
  .halt[data-s="passed"]::before { background: var(--pass); border-color: var(--pass); }
  .halt[data-s="failed"]::before { background: var(--fail); border-color: var(--fail); }
  .halt[data-s="running"]::before { background: var(--move); border-color: var(--move); box-shadow: 0 0 0 5px color-mix(in oklch, var(--move) 25%, transparent); animation: beat 1.1s var(--ease) infinite; }
  .halt-head { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 9px 12px; border-radius: 10px; border: 1px solid transparent; background: none; text-align: left; cursor: pointer; }
  .halt-head:hover { background: var(--sheet); border-color: var(--rule-soft); }
  .halt[data-open="true"] .halt-head { background: var(--sheet); border-color: var(--rule); border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
  .halt[data-s="failed"] .halt-head { border-color: color-mix(in oklch, var(--fail) 35%, transparent); }
  .halt[data-s="running"] .halt-head { border-color: color-mix(in oklch, var(--move) 45%, transparent); background: var(--sheet); }
  .halt-title { font-size: 14.5px; font-weight: 550; min-width: 0; }
  .halt-title small { display: block; font: 11.5px var(--mono); color: var(--ink-3); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tagline { font: 700 10.5px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; padding: 4px 8px; border-radius: 999px; background: var(--paper-2); color: var(--ink-3); }
  [data-s="passed"] .tagline { background: var(--pass-wash); color: var(--pass); }
  [data-s="failed"] .tagline { background: var(--fail-wash); color: var(--fail); }
  [data-s="running"] .tagline { background: var(--move-wash); color: var(--ink); }
  .halt-time { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; min-width: 46px; text-align: right; }
  .halt-body { border: 1px solid var(--rule); border-top: 0; border-radius: 0 0 10px 10px; background: var(--sheet); padding: 12px; display: grid; gap: 12px; }
  .halt[data-s="failed"] .halt-body { border-color: color-mix(in oklch, var(--fail) 35%, transparent); }
  .halt[data-open="false"] .halt-body { display: none; }
  .err { margin: 0; padding: 12px 14px; border-radius: 8px; background: var(--fail-wash); font: 12.5px/1.55 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 260px; overflow: auto; }
  .proof { border-radius: 8px; overflow: hidden; border: 1px solid var(--rule); }
  .proof figcaption { padding: 7px 10px; font-size: 12px; color: var(--ink-3); border-bottom: 1px solid var(--rule); background: var(--paper-2); }
  .proof img { display: block; width: 100%; height: auto; }
  .mini-log { margin: 0; background: var(--term); color: var(--term-ink); border-radius: 8px; padding: 10px 12px; font: 12px/1.6 var(--mono); max-height: 220px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
  .hint { font-size: 12.5px; color: var(--ink-3); }
  .hint code { font: 11.5px var(--mono); background: var(--paper-2); padding: 2px 6px; border-radius: 5px; overflow-wrap: anywhere; }

  .dock { position: sticky; top: 16px; display: grid; gap: 14px; }
  .viewport { border-radius: 12px; overflow: hidden; background: var(--term); border: 1px solid var(--term-2); }

  /* ── QA Report tab ─────────────────────────────────────────────────────── */

  .finding-body .loc a code, .finding-body .loc > code { font: 12px var(--mono); background: var(--paper-2); padding: 2px 6px; border-radius: 5px; color: var(--ink); }

  .pl-input { font: 12.5px var(--mono); background: var(--term); color: var(--term-ink); border: 1px solid var(--rule); padding: 6px 9px; border-radius: 6px; width: min(420px, 100%); min-width: 0; }
  .pl-input:focus { outline: 2px solid color-mix(in oklch, var(--brand) 55%, transparent); outline-offset: 1px; border-color: var(--brand); }

  .ub-row { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) auto; gap: 10px 16px; align-items: start; padding: 10px 0; border-top: 1px solid var(--rule-soft); }

  @media (max-width: 980px) { .ub-row { grid-template-columns: minmax(0, 1fr); } .ub-actions { justify-content: flex-start; } }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .sev-medium, :root:not([data-theme="light"]) .sev-dot.medium, :root:not([data-theme="light"]) .sev-pill.medium { --sev: oklch(80% 0.12 95); --sev-wash: oklch(32% 0.06 95); }
  }
  :root[data-theme="dark"] .sev-medium, :root[data-theme="dark"] .sev-dot.medium, :root[data-theme="dark"] .sev-pill.medium { --sev: oklch(80% 0.12 95); --sev-wash: oklch(32% 0.06 95); }

  .report-bar { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
  .report-meta .hint a { color: var(--brand); }
  .sev-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .sev-pill { font: 700 10.5px/1 var(--body); letter-spacing: .05em; text-transform: uppercase; padding: 4px 9px; border-radius: 999px; background: var(--sev-wash); color: var(--sev); white-space: nowrap; }
  .stat-pill { font: 700 10.5px/1 var(--body); letter-spacing: .04em; text-transform: uppercase; padding: 4px 9px; border-radius: 999px; background: var(--paper-2); color: var(--ink-2); }
  .stat-pill.confirmed { background: var(--fail-wash); color: var(--fail); }

  .findings { display: grid; gap: 12px; }

  .finding-head { display: flex; align-items: center; gap: 12px; padding: 14px 16px; cursor: pointer; user-select: none; }
  .finding-head:hover { background: color-mix(in oklch, var(--sev-wash) 40%, transparent); }
  .sev-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--sev); flex: none; }
  .finding-title { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .finding-title .fid { font: 700 11px/1 var(--mono); color: var(--ink-3); letter-spacing: .04em; }
  .finding-title b { font: 600 clamp(15px, 1.5vw, 17px)/1.3 var(--display); letter-spacing: -.01em; }
  .finding-sub { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .present { font: 700 10px/1 var(--body); letter-spacing: .05em; text-transform: uppercase; padding: 3px 7px; border-radius: 999px; }
  .present.yes { background: var(--fail-wash); color: var(--fail); }
  .present.no { background: var(--pass-wash); color: var(--pass); }
  .chev { width: 20px; height: 20px; color: var(--ink-3); flex: none; transition: transform .25s cubic-bezier(.2,.7,.2,1); }
  .finding.open .chev { transform: rotate(180deg); }
  .finding-body { padding: 2px 18px 18px 41px; display: grid; gap: 12px; animation: fade .25s ease; }
  .finding-body p { color: var(--ink-2); max-width: 82ch; }
  .finding-body b { color: var(--ink); }
  .finding-body .loc ul { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 5px; }
  .finding-body .loc code { font: 12px var(--mono); background: var(--paper-2); padding: 2px 6px; border-radius: 5px; color: var(--ink); }
  .steps ol { margin: 8px 0 0; padding-left: 20px; display: grid; gap: 7px; color: var(--ink-2); counter-reset: step; }
  .steps ol li { padding-left: 4px; }
  .steps ol li::marker { font: 700 13px var(--mono); color: var(--brand); }
  .fix { border-left: 2px solid var(--pass); background: var(--pass-wash); padding: 10px 14px; border-radius: 0 8px 8px 0; }
  @keyframes fade { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }

  .scan-busy { display: flex; align-items: center; gap: 12px; padding: 22px; color: var(--ink-2); }
  .spinner { width: 18px; height: 18px; border: 2px solid var(--rule); border-top-color: var(--brand); border-radius: 50%; animation: spin .7s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #scanBtn svg { width: 12px; height: 12px; }
  #scanBtn svg path { stroke: currentColor; stroke-width: 1.8; fill: none; stroke-linecap: round; }

  .heuristics { margin-top: 20px; border-top: 1px solid var(--rule); padding-top: 14px; }
  .heuristics > summary { cursor: pointer; font: 600 14px var(--display); color: var(--ink); }
  .heur { margin: 12px 0; }
  .heur .n { display: inline-block; min-width: 18px; text-align: center; font: 700 11px/1.5 var(--mono); padding: 1px 6px; border-radius: 999px; background: var(--paper-2); color: var(--ink-2); }
  .heur ul, .ok-list { margin: 8px 0 0; padding-left: 18px; display: grid; gap: 5px; color: var(--ink-2); font-size: 13.5px; }
  .heur code { font: 12px var(--mono); color: var(--ink); }

  /* ── Narrow ────────────────────────────────────────────────────────────── */
  @media (max-width: 1180px) {

  }
</style>

<body>
<div class="frame">
  <!-- ── Index ───────────────────────────────────────────────────────── -->
  <aside class="index" aria-label="Add-ons">
    <div class="masthead">
      <div class="wordmark"><b>Add-on QA</b><span>WP Travel Engine</span></div>
      <a class="site" id="site" href="#" target="_blank" rel="noopener"><i class="pulse" id="conn"></i><span id="siteText">connecting…</span></a>
    </div>
    <div class="coverage" id="coverage"></div>
    <label class="search"><span class="sr">Find an add-on</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="find" type="search" placeholder="Find an add-on" autocomplete="off">
    </label>
    <div class="filters" role="group" aria-label="Show">
      <button data-f="all" aria-pressed="true">All</button>
      <button data-f="auto" aria-pressed="false">Automated</button>
      <button data-f="todo" aria-pressed="false">No tests yet</button>
    </div>
    <nav class="catalog" id="catalog" aria-label="Add-on list"></nav>
    <div class="index-foot">
      <span class="foot-links">
        <a class="foot-link" id="securityLink" href="#/security">Security</a>
        <a class="foot-link" id="settingsLink" href="#/settings">Settings</a>
        <a class="foot-link" href="/report/" target="_blank" rel="noopener">HTML report ↗</a>
      </span>
    </div>
  </aside>

  <!-- ── Stage ───────────────────────────────────────────────────────── -->
  <main class="stage" id="stage">
    <div class="busy-strip" id="busy" hidden></div>
    <div id="view"></div>
  </main>
</div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ms = (v) => v == null ? "" : v < 1000 ? `${v}ms` : v < 60000 ? `${(v / 1000).toFixed(1)}s` : `${Math.floor(v / 60000)}m ${String(Math.round((v % 60000) / 1000)).padStart(2, "0")}s`;
const ago = (iso) => {
  if (!iso) return "";
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 60) return "just now"; if (s < 3600) return `${Math.round(s / 60)}m ago`;
  if (s < 86400) return `${Math.round(s / 3600)}h ago`; return `${Math.round(s / 86400)}d ago`;
};
const legName = (s) => s.replace(/^\d+\.\s*/, "");
const legNo = (s, i) => (s.match(/^(\d+)\./) || [, String(i + 1)])[1].padStart(2, "0");

const S = {
  catalog: null, site: "", filter: "all", find: "",
  slug: null, tab: "features", detail: {},          // detail[slug]
  selected: {},                                     // slug → Set
  run: { status: "idle", running: false },          // server run state
  live: {}, logs: {}, started: {}, current: null,   // per-test live state for the running add-on
  open: new Set(), log: [], frame: null, opts: { live: true, headed: false, cleanup: false },
  report: {}, reportOpen: new Set(), scanning: false,   // QA Report tab: report[slug], expanded finding ids
};

// ── theme ─────────────────────────────────────────────────────────────────
function setTheme(t) {
  if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
  theme = t;
  // The switch lives on the Settings page (Appearance card).
  document.querySelectorAll("[data-theme-choice]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.themeChoice === t)));
  try { t === "system" ? localStorage.removeItem("addonQa.theme") : localStorage.setItem("addonQa.theme", t); } catch {}
}
let theme = "system"; try { theme = localStorage.getItem("addonQa.theme") || "system"; } catch {}
setTheme(theme);
try { Object.assign(S.opts, JSON.parse(localStorage.getItem("addonQa.opts") || "{}")); } catch {}
const saveOpts = () => { try { localStorage.setItem("addonQa.opts", JSON.stringify(S.opts)); } catch {} };

// ── routing: #/<slug>/<tab> ───────────────────────────────────────────────
function route() {
  const [, slug, tab] = location.hash.match(/^#\/([a-z0-9-]+)(?:\/(\w+))?/) || [];
  const first = S.catalog?.addons.find((a) => a.automated)?.slug;
  S.slug = slug || S.run.slug || first;
  S.tab = tab || (S.run.running && S.run.slug === S.slug ? "run" : "features");
  load(S.slug);
}
window.addEventListener("hashchange", route);
const go = (slug, tab) => { location.hash = `#/${slug}${tab ? "/" + tab : ""}`; };

async function load(slug) {
  renderCatalog();
  $("#settingsLink").toggleAttribute("aria-current", slug === "settings");
  $("#securityLink").toggleAttribute("aria-current", slug === "security");
  if (slug === "security") {
    $("#securityLink").setAttribute("aria-current", "page");
    renderBusy();
    await loadSecurity();
    return;
  }
  if (slug === "settings") {
    $("#settingsLink").setAttribute("aria-current", "page");
    renderBusy();
    if (!S.settings) $("#view").innerHTML = `<p class="hint" style="padding:32px var(--gap)">Loading settings…</p>`;
    await loadSettings();
    return;
  }
  const meta = S.catalog.addons.find((a) => a.slug === slug);
  if (meta?.automated && !S.detail[slug]) {
    renderStage(); // skeleton header from catalog meta
    S.detail[slug] = await (await fetch(`/api/addons/${slug}`)).json();
    Object.entries(S.detail[slug].results || {}).forEach(([id, r]) => r.status === "failed" && S.open.add(id));
  }
  renderStage();
}

// ── status helpers ────────────────────────────────────────────────────────
function statusOf(slug, id) {
  if (S.run.slug === slug && S.live[id]) return S.live[id];
  const r = S.detail[slug]?.results?.[id];
  return r ? r.status : "notrun";
}
const sel = (slug) => (S.selected[slug] ||= new Set());

// ── index ─────────────────────────────────────────────────────────────────
function addonMark(a) {
  if (!a.automated) return "none";
  if (S.run.running && S.run.slug === a.slug) return "running";
  return a.last?.status === "passed" ? "passed" : a.last?.status === "failed" ? "failed" : "";
}
function renderCatalog() {
  const c = S.catalog; if (!c) return;
  const auto = c.addons.filter((a) => a.automated);
  const tests = auto.reduce((n, a) => n + a.tests, 0);
  $("#coverage").innerHTML = `<p><b>${auto.length}</b> of ${c.addons.length} add-ons automated · ${tests} tests</p>
    <div class="coverage-bar" aria-hidden="true">${c.addons.map((a) => `<i class="${a.automated ? "auto" : ""} ${a.last?.status === "failed" ? "failed" : ""}"></i>`).join("")}</div>`;
  const q = S.find.trim().toLowerCase();
  const list = c.addons.filter((a) => (S.filter === "all" || (S.filter === "auto" ? a.automated : !a.automated)) && (!q || `${a.name} ${a.group} ${a.description}`.toLowerCase().includes(q)));
  const groups = c.groups.filter((g) => list.some((a) => a.group === g));
  $("#catalog").innerHTML = groups.length ? groups.map((g) => {
    const items = list.filter((a) => a.group === g).sort((x, y) => (y.automated - x.automated) || x.name.localeCompare(y.name));
    return `<div class="cat-group"><h3><span>${esc(g)}</span><span>${items.filter((a) => a.automated).length}/${items.length}</span></h3>
      ${items.map((a) => {
        const m = addonMark(a);
        const meta = !a.automated ? "No tests yet" : m === "running" ? "Running now" : a.last ? `${a.tests} tests · ${a.last.status} ${ago(a.last.finishedAt)}` : `${a.tests} tests · not run`;
        return `<a class="addon-link ${a.automated ? "" : "dim"}" href="#/${a.slug}" ${a.slug === S.slug ? 'aria-current="page"' : ""}><i class="mark ${m}" aria-hidden="true"></i><span><span class="nm">${esc(a.name)}</span><span class="mt">${esc(meta)}</span></span></a>`;
      }).join("")}</div>`;
  }).join("") : `<p class="hint" style="padding:12px">Nothing matches “${esc(S.find)}”.</p>`;
}
$("#find").oninput = (e) => { S.find = e.target.value; renderCatalog(); };
document.querySelectorAll("[data-f]").forEach((b) => (b.onclick = () => {
  S.filter = b.dataset.f;
  document.querySelectorAll("[data-f]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  renderCatalog();
}));

// ── stage ─────────────────────────────────────────────────────────────────
function renderBusy() {
  const strip = $("#busy");
  const other = S.run.running && S.run.slug !== S.slug;
  strip.hidden = !other;
  if (other) {
    const name = S.catalog.addons.find((a) => a.slug === S.run.slug)?.name || S.run.slug;
    const done = Object.values(S.live).filter((s) => s === "passed" || s === "failed").length;
    strip.innerHTML = `<i class="mark running" aria-hidden="true"></i><span><b>${esc(name)}</b> is running · ${done} of ${S.run.selection?.length || "?"} done. Runs share the site, so others wait.</span><a href="#/${S.run.slug}/run">Watch it</a>`;
  }
}

function renderStage() {
  renderBusy();
  if (S.slug === "settings" || S.slug === "security") return; // these pages render themselves
  const meta = S.catalog.addons.find((a) => a.slug === S.slug);
  if (!meta) { $("#view").innerHTML = `<div class="head"><div><p class="eyebrow">Not found</p><h1>Unknown add-on</h1></div></div>`; return; }
  if (!meta.automated) return renderTodo(meta);
  const d = S.detail[S.slug];
  const running = S.run.running && S.run.slug === S.slug;
  const busyElsewhere = S.run.running && !running;
  const n = sel(S.slug).size;
  const results = d?.results || {};
  const failed = d ? d.tests.filter((t) => statusOf(S.slug, t.id) === "failed").length : 0;
  const last = d?.history?.[0];

  $("#view").innerHTML = `
    <header class="head">
      <div>
        <p class="eyebrow">${esc(meta.group)}</p>
        <h1>${esc(meta.name)}</h1>
        <p class="lede">${esc(meta.description)}</p>
      </div>
      <div class="launch">
        <div class="launch-row">
          ${running ? `<button class="btn stop" id="stopBtn">Stop run</button>` : ""}
          <button class="btn go" id="runBtn" ${running || busyElsewhere || !d ? "disabled" : ""}>
            <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 1.2v9.6L10.5 6z"/></svg>${n ? `Run ${n} selected` : "Run all tests"}
          </button>
        </div>
        <div class="switches">
          <label class="sw"><input type="checkbox" data-opt="live" ${S.opts.live ? "checked" : ""} ${running ? "disabled" : ""}> Live view</label>
          <label class="sw"><input type="checkbox" data-opt="headed" ${S.opts.headed ? "checked" : ""} ${running ? "disabled" : ""}> Show browser</label>
          ${meta.slug && d?.cleanupEnv ? `<label class="sw" title="Delete what the suite built on the site when it ends"><input type="checkbox" data-opt="cleanup" ${S.opts.cleanup ? "checked" : ""} ${running ? "disabled" : ""}> Clean up after</label>` : ""}
        </div>
        <p class="errline" id="runErr"></p>
      </div>
      <div class="facts">
        <span><b>${d ? d.tests.length : meta.tests}</b> tests in <b>${d ? d.sections.length : meta.sections}</b> feature groups</span>
        ${last ? `<span>Last run <b>${esc(last.status)}</b> ${ago(last.finishedAt)}${last.duration ? ` · ${ms(last.duration)}` : ""}</span>` : `<span>Never run from here</span>`}
        <span><code>${esc(d?.spec || "")}</code></span>
      </div>
    </header>
    <div class="tabs" role="tablist">
      ${tabBtn("features", "Features", d ? `<span class="n ${failed ? "bad" : ""}">${failed ? failed + " failing" : d.tests.length}</span>` : "")}
      ${tabBtn("run", "Run", running ? `<span class="n live">live</span>` : "")}
      ${tabBtn("history", "History", d?.history?.length ? `<span class="n">${d.history.length}</span>` : "")}
      ${d?.fixtures || meta.slug === "wptravelengine-accommodation" ? tabBtn("fixtures", d?.fixtures?.kind || "Fixtures", d?.fixtures?.items ? `<span class="n">${d.fixtures.items.length}</span>` : "") : ""}
      ${d?.bookings || meta.slug === "wptravelengine-accommodation" ? tabBtn("bookings", "Bookings", d?.bookings?.items?.length ? `<span class="n ${d.bookings.items.some((it) => !it.verified) ? "bad" : ""}">${d.bookings.items.length}</span>` : "") : ""}
      ${d?.hasReport || meta.hasReport ? tabBtn("report", "QA Report", reportCount(S.slug)) : ""}
    </div>
    <section class="panel" id="panel"></section>`;

  $("#view").querySelectorAll("[data-tab]").forEach((b) => (b.onclick = () => go(S.slug, b.dataset.tab)));
  $("#view").querySelectorAll("[data-opt]").forEach((i) => (i.onchange = () => { S.opts[i.dataset.opt] = i.checked; saveOpts(); }));
  const rb = $("#runBtn"); if (rb) rb.onclick = () => startRun([...sel(S.slug)]);
  const sb = $("#stopBtn"); if (sb) sb.onclick = () => fetch("/api/stop", { method: "POST" });
  renderPanel();
}
const tabBtn = (id, label, extra) => `<button class="tab" role="tab" data-tab="${id}" aria-selected="${S.tab === id}">${label}${extra || ""}</button>`;

function renderPanel() {
  const panel = $("#panel"); if (!panel) return;
  const d = S.detail[S.slug];
  if (!d) { panel.innerHTML = `<p class="hint">Reading the test list…</p>`; return; }
  if (S.tab === "run") return renderRun(panel, d);
  if (S.tab === "history") return renderHistory(panel, d);
  if (S.tab === "fixtures") return renderFixtures(panel, d);
  if (S.tab === "bookings") return renderBookings(panel, d);
  if (S.tab === "report") return renderReport(panel, d);
  renderFeatures(panel, d);
}

// ── Features tab ──────────────────────────────────────────────────────────
function renderFeatures(panel, d) {
  const set = sel(S.slug);
  const running = S.run.running;
  panel.innerHTML = `
    <div class="plan-tools">
      <button data-q="all">Select all</button><button data-q="none">Clear</button><button data-q="failed">Select failing</button>
      <span class="sel">${set.size ? `${set.size} selected` : "Running everything"}</span>
    </div>
    <div class="legs">${d.sections.map((section, i) => {
      const tests = d.tests.filter((t) => t.section === section);
      const st = tests.map((t) => statusOf(S.slug, t.id));
      const all = tests.every((t) => set.has(t.id)), some = tests.some((t) => set.has(t.id));
      const p = st.filter((s) => s === "passed").length, f = st.filter((s) => s === "failed").length;
      return `<section class="leg">
        <div class="leg-no" aria-hidden="true">${legNo(section, i)}</div>
        <div>
          <div class="leg-head">
            <h2>${esc(legName(section))}</h2>
            <span class="tally">${tests.length} test${tests.length > 1 ? "s" : ""}${p + f ? ` · ${p} passed${f ? `, ${f} failed` : ""}` : ""}</span>
            <label><input type="checkbox" data-leg="${esc(section)}" ${all ? "checked" : ""} ${!all && some ? "data-ind" : ""} ${running ? "disabled" : ""}> Select group</label>
          </div>
          <ol>${tests.map((t) => {
            const s = statusOf(S.slug, t.id), r = d.results[t.id] || {};
            return `<li class="stop-row">
              <input type="checkbox" data-id="${esc(t.id)}" aria-label="Select ${esc(t.title)}" ${set.has(t.id) ? "checked" : ""} ${running ? "disabled" : ""}>
              <i class="glyph ${s}" title="${s === "notrun" ? "not run" : s}"></i>
              <span class="t">${esc(t.title)}</span>
              <span class="d">${ms(r.duration)}</span>
              <button class="solo" data-solo="${esc(t.id)}" ${running ? "disabled" : ""}>Run</button>
            </li>`;
          }).join("")}</ol>
        </div>
      </section>`;
    }).join("")}</div>`;
  panel.querySelectorAll("[data-ind]").forEach((x) => (x.indeterminate = true));
  panel.onchange = (e) => {
    const el = e.target;
    if (el.dataset.id) el.checked ? set.add(el.dataset.id) : set.delete(el.dataset.id);
    if (el.dataset.leg) d.tests.filter((t) => t.section === el.dataset.leg).forEach((t) => (el.checked ? set.add(t.id) : set.delete(t.id)));
    renderStage();
  };
  panel.onclick = (e) => {
    const q = e.target.dataset?.q, solo = e.target.dataset?.solo;
    if (solo) return startRun([solo]);
    if (!q) return;
    if (q === "all") d.tests.forEach((t) => set.add(t.id));
    if (q === "none") set.clear();
    if (q === "failed") { set.clear(); d.tests.filter((t) => statusOf(S.slug, t.id) === "failed").forEach((t) => set.add(t.id)); }
    renderStage();
  };
}

// ── Run tab: the route + live dock ────────────────────────────────────────
function lineClass(l) {
  if (/^\s*\d+\)\s|Error:|✘|Timeout \d+ms exceeded|expect\(/.test(l)) return "l-bad";
  if (/^\s*✓|passed/.test(l)) return "l-ok";
  if (/^ℹ|⚠|retrying/.test(l)) return "l-warn";
  if (/^\[\d+\/\d+\]|^▶|^■/.test(l)) return "l-hi";
  if (/^\s{4,}|Call log|waiting for|─{4,}|attachment|Usage:|show-trace/.test(l)) return "l-dim";
  return "";
}
function renderRun(panel, d) {
  const mine = S.run.slug === S.slug;
  const ids = mine && S.run.selection?.length ? S.run.selection : d.tests.filter((t) => d.results[t.id]).map((t) => t.id);
  if (!ids.length) {
    panel.innerHTML = `<div class="blank"><h2>No run yet</h2><p>Start one with <b>Run all tests</b>, or pick tests on the Features tab. The browser shows up here while it works, and each test's output stays attached to it.</p></div>`;
    return;
  }
  const tests = ids.map((id) => d.tests.find((t) => t.id === id)).filter(Boolean);
  const st = tests.map((t) => statusOf(S.slug, t.id));
  const p = st.filter((s) => s === "passed").length, f = st.filter((s) => s === "failed").length;
  const running = S.run.running && mine;
  const overall = running ? "running" : f ? "failed" : p ? "passed" : "";
  const headline = running ? `Test ${Math.min(p + f + 1, tests.length)} of ${tests.length}` : f ? `${f} failed` : `All ${p} passed`;
  const elapsed = running && S.run.startedAt ? Date.now() - new Date(S.run.startedAt).getTime() : tests.reduce((a, t) => a + (d.results[t.id]?.duration || 0), 0);
  const sections = [...new Set(tests.map((t) => t.section))];

  panel.innerHTML = `
    <div class="run-layout">
      <div>
        <div class="run-summary">
          <span class="big ${overall}">${headline}</span>
          <span class="figs"><span class="p"><b>${p}</b> passed</span><span class="f"><b>${f}</b> failed</span><span><b>${tests.length - p - f}</b> to go</span><span><b>${ms(elapsed) || "–"}</b></span></span>
        </div>
        <div class="progress" aria-hidden="true"><i style="width:${tests.length ? ((p + f) / tests.length) * 100 : 0}%"></i></div>
        <div class="route">${sections.map((section) => `
          <div class="route-leg"><h3>${esc(legName(section))}</h3>
            ${tests.filter((t) => t.section === section).map((t) => halt(t, d)).join("")}
          </div>`).join("")}
        </div>
      </div>
      <aside class="dock" aria-label="Live">
        ${viewport(running)}
        <div class="console">
          <div class="console-bar"><b>Output</b><span id="logCount">${S.log.length} lines</span><button id="copyLog">Copy</button></div>
          <pre id="log" aria-live="off">${S.log.map((l) => `<span class="${lineClass(l)}">${esc(l)}</span>`).join("\n") || '<span class="l-dim">Output appears here when a run starts.</span>'}</pre>
        </div>
      </aside>
    </div>`;
  const pre = $("#log"); pre.scrollTop = pre.scrollHeight;
  $("#copyLog").onclick = () => navigator.clipboard?.writeText(S.log.join("\n"));
  panel.onclick = (e) => {
    const h = e.target.closest("[data-halt]"); if (!h) return;
    const id = h.dataset.halt; S.open.has(id) ? S.open.delete(id) : S.open.add(id); renderPanel();
  };
  panel.onchange = null;
}
function halt(t, d) {
  const s0 = statusOf(S.slug, t.id);
  const s = s0 === "notrun" ? (S.run.running && S.run.slug === S.slug ? "queued" : "skipped") : s0;
  const r = d.results[t.id] || {};
  const logs = S.logs[t.id] || [];
  const open = S.open.has(t.id) || s === "running";
  const dur = r.duration ?? (s === "running" && S.started[t.id] ? Date.now() - S.started[t.id] : null);
  const lastLine = [...logs].reverse().find((l) => l.trim() && !/^\s{4,}/.test(l));
  const label = { queued: "Queued", running: "Running", passed: "Passed", failed: "Failed", skipped: "Not run", stopped: "Stopped" }[s] || s;
  return `<div class="halt" data-s="${s}" data-open="${open}">
    <button class="halt-head" data-halt="${esc(t.id)}" aria-expanded="${open}">
      <span class="halt-title">${esc(t.title)}${s === "running" && lastLine && !open ? `<small>${esc(lastLine.trim())}</small>` : ""}</span>
      <span class="tagline">${label}</span>
      <span class="halt-time">${ms(dur)}</span>
    </button>
    ${open ? `<div class="halt-body">
      ${r.error ? `<pre class="err">${esc(r.error.trim())}</pre>` : ""}
      ${r.screenshot ? `<figure class="proof" style="margin:0"><figcaption>The page when it failed</figcaption><img loading="lazy" alt="Screenshot when “${esc(t.title)}” failed" src="/api/file?path=${encodeURIComponent(r.screenshot)}"></figure>` : ""}
      ${logs.length ? `<pre class="mini-log">${logs.map((l) => `<span class="${lineClass(l)}">${esc(l)}</span>`).join("\n")}</pre>` : `<p class="hint">${s === "queued" ? "Waiting its turn. Tests run one after another." : s === "running" ? "Working…" : "No output captured for this test in this session."}</p>`}
      ${r.trace ? `<p class="hint">Step through it: <code>npx playwright show-trace "${esc(r.trace)}"</code></p>` : ""}
    </div>` : ""}
  </div>`;
}
function viewport(running) {
  const f = S.frame && S.frame.slug === S.slug ? S.frame : null;
  const show = running && S.opts.live && f;
  return `<div class="viewport">
    <div class="vp-bar"><span class="vp-lights" aria-hidden="true"><i></i><i></i><i></i></span><span class="vp-url" id="vpUrl">${esc(f?.url || "about:blank")}</span><span class="vp-state ${running && S.opts.live ? "on" : ""}">${running && S.opts.live ? "Live" : "Idle"}</span></div>

  </div>`;
}

        <td class="note">${(it.lines || []).length ? it.lines.map((l) => `${esc(l.label)} · ${l.quantity} × ${money(l.price)} = <b>${money(l.total)}</b>`).join("<br>") : `<span class="hint">none</span>`}</td>
        <td>${it.travellers ?? "–"}</td>
        <td><b>${money(it.total)}</b>${it.expectedTotal != null && it.total !== it.expectedTotal ? `<br><span class="hint">expected ${money(it.expectedTotal)}</span>` : ""}</td>
        <td>${it.payment ? `<span class="tag">${esc(it.payment.status)}</span><br><span class="hint">${money(it.payment.amount)}</span>` : `<span class="hint">–</span>`}</td>

        <td style="white-space:nowrap">${it.editUrl ? `<a href="${esc(it.editUrl)}" target="_blank" rel="noopener">Open</a>` : ""}</td>

}

// ── QA Report tab ──────────────────────────────────────────────────────────
const SEV = { critical: "Critical", high: "High", medium: "Medium", low: "Low" };
const reportCount = (slug) => {
  const r = S.report[slug];
  return r?.findings?.length ? `<span class="n">${r.findings.length}</span>` : "";
};

async function loadReport(slug, { scan = false } = {}) {
  S.scanning = scan;
  if (scan) renderPanel();
  try {
    const res = await fetch(`/api/report/${slug}`, { method: scan ? "POST" : "GET" });
    const body = await res.json();
    if (body.ok) S.report[slug] = body.report;
    else S.report[slug] = { error: body.error || "Could not load the report." };
  } catch (e) {
    S.report[slug] = { error: e.message };
  }
  S.scanning = false;
  if (S.tab === "report") renderPanel();
  renderStage(); // refresh the tab count
}

function ghLink(repoUrl, loc, commit) {
  if (!repoUrl) return esc(`${loc.file}:${loc.line}`);
  const base = repoUrl.replace(/\.git$/, "");
  const ref = commit || "main";
  return `<a href="${esc(base)}/blob/${esc(ref)}/${esc(loc.file)}#L${loc.line}" target="_blank" rel="noopener"><code>${esc(loc.file)}:${loc.line}</code></a>`;
}

function renderReport(panel, d) {
  const slug = S.slug;
  const r = S.report[slug];
  panel.onclick = panel.onchange = null;

  if (!r && !S.scanning) { loadReport(slug); panel.innerHTML = `<p class="hint">Reading the QA report…</p>`; return; }
  if (GHS === null) { ensureGithub(() => { if (S.tab === "report") renderPanel(); }); }
  if (S.scanning) { panel.innerHTML = `<div class="scan-busy"><span class="spinner"></span> Looking into the repository — cloning, pulling latest and re-locating each finding in the source…</div>`; return; }
  if (r.error) { panel.innerHTML = `<div class="blank"><h2>No report</h2><p>${esc(r.error)}</p></div>`; return; }

  const sevRank = { critical: 0, high: 1, medium: 2, low: 3 };
  const findings = [...(r.findings || [])].sort((a, b) => (sevRank[a.severity] ?? 9) - (sevRank[b.severity] ?? 9));
  const counts = findings.reduce((m, f) => ((m[f.severity] = (m[f.severity] || 0) + 1), m), {});
  const scan = r.scan;
  const repoUrl = r.repoUrl || r.repo;

  panel.innerHTML = `
    <div class="report-bar">
      <div class="report-meta">
        <p class="hint">Findings in <a href="${esc((repoUrl || "").replace(/\.git$/, ""))}" target="_blank" rel="noopener">${esc((repoUrl || "").replace(/^https?:\/\//, "").replace(/\.git$/, ""))}</a>${r.commit ? ` · <code>${esc(r.commit)}</code>` : ""}${r.site ? ` · verified on ${esc(r.site.replace(/^https?:\/\//, ""))}` : ""}</p>
        <div class="sev-row">
          ${["critical", "high", "medium", "low"].filter((s) => counts[s]).map((s) => `<span class="sev-pill ${s}">${counts[s]} ${SEV[s]}</span>`).join("")}
          ${scan ? `<span class="hint">· ${scan.confirmedStillPresent}/${scan.findingsTotal} still present in source · scanned ${ago(scan.scannedAt)}</span>` : `<span class="hint">· not yet re-scanned</span>`}
        </div>
      </div>
      <button class="btn go" id="scanBtn"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1v10M1 6h10"/></svg>Re-scan repo</button>
    </div>
    ${r.intro ? `<p class="report-intro">${esc(r.intro)}</p>` : ""}
    <div class="findings">
      ${findings.map((f) => renderFinding(f, repoUrl, r.commit, slug)).join("")}
    </div>
    ${scan?.heuristics?.length ? `<details class="heuristics"><summary>Repo-wide pattern scan <span class="hint">(${scan.heuristics.reduce((n, h) => n + h.count, 0)} matches across the source)</span></summary>
      ${scan.heuristics.map((h) => `<div class="heur"><b>${esc(h.label)}</b> <span class="n">${h.count}</span>
        <ul>${h.hits.map((hit) => `<li>${ghLink(repoUrl, hit, r.commit)} — <span class="hint">${esc(hit.text)}</span></li>`).join("")}${h.count > h.hits.length ? `<li class="hint">…and ${h.count - h.hits.length} more</li>` : ""}</ul></div>`).join("")}
    </details>` : ""}
    ${r.checkedNotIssues?.length ? `<details class="heuristics"><summary>Checked and found working <span class="hint">(${r.checkedNotIssues.length})</span></summary>
      <ul class="ok-list">${r.checkedNotIssues.map((t) => `<li>${esc(t)}</li>`).join("")}</ul></details>` : ""}`;

  panel.querySelectorAll(".finding-head").forEach((h) => (h.onclick = () => {
    const id = h.dataset.id;
    S.reportOpen.has(id) ? S.reportOpen.delete(id) : S.reportOpen.add(id);
    renderPanel();
  }));
  const sb = panel.querySelector("#scanBtn");
  if (sb) sb.onclick = () => loadReport(slug, { scan: true });
  panel.querySelectorAll("[data-reportfile]").forEach((b) => (b.onclick = () => fileReportIssue(slug, b.dataset.reportfile)));
}

// Shared GitHub-filing status (used by both the Security tab and the QA Report tab).
let GHS = null;
async function ensureGithub(then) {
  try { GHS = await (await fetch("/api/security/github")).json(); } catch { GHS = {}; }
  if (then) then();
  return GHS;
}
async function fileReportIssue(slug, id) {
  const btn = document.querySelector(`[data-reportfile="${id}"]`);
  if (btn) { btn.disabled = true; btn.textContent = "Filing…"; }
  try {
    const r = await (await fetch(`/api/report/${slug}/file-issue`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id }) })).json();
    if (!r.ok) throw new Error(r.error);
    S.report[slug] = r.report;

    if (btn) { btn.disabled = false; btn.textContent = "File issue"; }

}

// ── Payloads (detection strings for the manual tests) ──────────────────────
async function loadPayloads() {
  if (SEC.pl) return;
  try { SEC.pl = (await (await fetch("/api/security/payloads")).json()).payloads; } catch (e) { SEC.pl = { error: e.message }; }
}

// Builds a full URL from the Payloads-tab target, with `payload` encoded into
// the chosen parameter (others left normal). Read live at click time so your
// edits to a payload are included. null when no valid target URL is set.
function refUrl(payload) {
  const t = (SEC.ub.url || "").trim();
  if (!t) return null;
  let u;
  try { u = new URL(t); } catch { return null; }
  const pairs = [...u.searchParams.entries()];
  let param = (SEC.ub.refParam || "").trim();
  if (!param) param = pairs[0]?.[0] || "s"; // default: first param, else WordPress search ?s=
  if (!pairs.some(([k]) => k === param)) pairs.push([param, ""]);
  const query = pairs.map(([k, v]) => `${encodeURIComponent(k)}=${k === param ? encodeURIComponent(payload) : encodeURIComponent(v)}`).join("&");
  return `${u.origin}${u.pathname}?${query}${u.hash || ""}`;
}

// An editable payload row: tweak it, copy it, URL-encode it, or (when a target
// URL is set on this tab) copy/open it as a full URL. The real value lives in
// the input (or data-full when too long), so quotes/brackets survive edits.
function payloadChip(p, note, label, withUrl = false) {
  const long = label != null;
  const field = long
    ? `<code class="pl-code" data-full="${esc(p)}" title="${esc(label)}">${esc(label)}</code>`
    : `<input class="pl-input" value="${esc(p)}" spellcheck="false" autocapitalize="off" autocomplete="off">`;
  return `<div class="pl-row">
    ${field}
    <button class="btn sm pl-copy" type="button">Copy</button>
    ${long ? "" : `<button class="btn sm pl-enc" type="button" title="Replace with a URL-safe (percent-encoded) version">URL-encode</button>`}
    ${withUrl ? `<button class="btn sm pl-url" type="button" title="Copy the full URL with this payload in it">Copy URL</button><a class="btn sm pl-open" target="_blank" rel="noopener" title="Open the URL in a new tab (edit it in the address bar there)">Open ↗</a>` : ""}
    ${note ? `<span class="hint">${esc(note)}</span>` : ""}
  </div>`;
}

function payloadBlock(g) {
  return `<div class="pl-group">
    <div class="card-head"><h2 style="font-size:18px">${esc(g.title)}</h2></div>
    <p class="hint"><b>How it works.</b> ${esc(g.how)}</p>
    <p class="hint"><b>Where to try it.</b> ${esc(g.where)}</p>
    <div class="pl-list">${g.items.map((i) => payloadChip(i.p, i.note, i.label, true)).join("")}</div>
    <p class="fix" style="margin-top:10px"><b>Look for.</b> ${esc(g.lookFor)}</p>
  </div>`;
}

const UB_CLASSES = [["xss", "XSS"], ["sqli", "SQLi"], ["traversal", "Traversal"], ["ssrf", "SSRF"], ["redirect", "Open redirect"], ["template", "Template"], ["email", "Email header"], ["boundaries", "Boundaries"]];

async function runUrlBuilder() {
  const b = SEC.ub;
  if (!b.request.trim()) { b.error = "Paste a URL, a curl command, or a raw HTTP request first."; return renderSecurity(); }
  b.busy = true; b.error = ""; renderSecurity();
  try {
    const res = await fetch("/api/security/build-request", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ request: b.request.trim(), params: b.params.trim() || undefined, classes: b.classes.size ? [...b.classes] : undefined }) });
    const body = await res.json();
    if (!body.ok) throw new Error(body.error);
    b.result = body.plan;
  } catch (e) { b.error = e.message; b.result = null; }
  b.busy = false; renderSecurity();
}

function ubRow(r) {
  const payload = esc(r.label || r.payload);
  const actions = r.url
    ? `<a class="btn sm" href="${esc(r.url)}" target="_blank" rel="noopener">Open ↗</a><button class="btn sm ub-copy" type="button" data-v="${esc(r.url)}">Copy URL</button>`
    : `<span class="present yes">${esc(r.method)}${r.loc === "json" ? " · JSON" : r.loc === "form" ? " · form" : ""}</span><button class="btn sm ub-copy" type="button" data-v="${esc(r.request)}">Copy curl</button>`;
  return `<div class="ub-row">
    <div class="ub-main"><code class="pl-code">${payload}</code> <span class="hint">${esc(r.note || "")}${r.encoded ? ` · encoded: <code>${esc(String(r.encoded).slice(0, 40))}</code>` : ""}</span></div>
    <div class="ub-sv"><span class="hint">✅ ${esc(r.safe)}</span><span class="hint">⚠️ ${esc(r.vulnerable)}</span></div>
    <div class="ub-actions">${actions}</div>
  </div>`;
}

function renderUrlBuilder() {
  const b = SEC.ub;
  const r = b.result;
  return `<section class="card wide">
    <div class="card-head"><h2>Request builder</h2></div>
    <p class="hint">Paste a request from your QA site — a plain URL, a curl command (DevTools → Copy as cURL), or a raw HTTP request (Burp). The builder changes <b>one payload in one parameter</b> per request (query, form field or JSON field), keeps the rest — including your nonce and cookies — normal, and adds a boundary block for numeric/price/date fields. <b>Authorized / own targets only.</b></p>
