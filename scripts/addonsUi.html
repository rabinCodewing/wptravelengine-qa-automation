    </div>
    <div class="actions">
      <button class="btn primary" id="ubRun" ${b.busy ? "disabled" : ""}>${b.busy ? "Building…" : "Build test plan"}</button>
      ${r ? `<button class="btn sm" id="ubCopyAll" type="button">Copy all as Markdown</button>` : ""}
      <span class="msg bad">${esc(b.error)}</span><span class="msg" id="ubMsg"></span>
    </div>
    ${r ? `<p class="hint">${r.groups.reduce((n, g) => n + g.rows.length, 0)} request(s) across ${r.groups.length} class(es) · <code>${esc(r.method)} ${esc(r.url)}</code>${r.hasAuth ? " · includes your session — don’t share the output" : ""}.</p>
      ${r.groups.map((g) => `<details class="ub-group" open><summary><b>${esc(g.title)}</b> <span class="n">${g.rows.length}</span></summary>${g.rows.map(ubRow).join("")}</details>`).join("")}
      <div class="pl-inline"><b>What to watch in the response</b><ul class="ok-list">${r.watch.map((w) => `<li>${esc(w)}</li>`).join("")}</ul></div>` : ""}
  </section>`;
}

function bindUrlBuilder(v) {
  const b = SEC.ub;
  const rq = $("#ubReq", v); if (rq) rq.oninput = (e) => { b.request = e.target.value; };
  const prm = $("#ubParams", v); if (prm) prm.oninput = (e) => { b.params = e.target.value; };
  v.querySelectorAll("[data-ubc]").forEach((btn) => (btn.onclick = () => { const k = btn.dataset.ubc; b.classes.has(k) ? b.classes.delete(k) : b.classes.add(k); renderSecurity(); }));
  const run = $("#ubRun", v); if (run) run.onclick = runUrlBuilder;
  v.querySelectorAll(".ub-copy").forEach((btn) => (btn.onclick = async () => {
    try { await navigator.clipboard.writeText(btn.dataset.v); const t = btn.textContent; btn.textContent = "Copied"; setTimeout(() => (btn.textContent = t), 1200); } catch { btn.textContent = "Blocked"; }
  }));
  const ca = $("#ubCopyAll", v);
  if (ca) ca.onclick = async () => {
    try { await navigator.clipboard.writeText(urlBuilderMarkdown(b.result)); flash("ubMsg", "Copied as Markdown."); } catch { flash("ubMsg", "Clipboard blocked.", "bad"); }
  };
}

function urlBuilderMarkdown(r) {
  const lines = [`# Payload test plan — ${r.method} ${r.url}`, "", "> Authorized / own targets only. Detection only.", r.hasAuth ? "> Includes your session cookie/nonce — don't share publicly." : "", ""].filter(Boolean);
  for (const g of r.groups) {
    lines.push(`## ${g.title}`, "", "| Param | Payload | Request | Safe / Vulnerable |", "| --- | --- | --- | --- |");
    for (const row of g.rows) {
      const req = row.url || row.request;
      lines.push(`| ${row.param} | \`${(row.label || row.payload).replace(/\|/g, "\\|").slice(0, 60)}\` | ${req.replace(/\|/g, "\\|")} | ✅ ${row.safe} / ⚠️ ${row.vulnerable} |`);
    }
    lines.push("");
  }
  lines.push("## What to watch in the response", "", ...r.watch.map((w) => `- ${w}`));
  return lines.join("\n");
}

function renderPayloads() {
  const g = SEC.pl;
  if (!g) { loadPayloads().then(renderSecurity); return `<p class="hint">Loading payloads…</p>`; }
  if (g.error) return `<p class="msg bad">${esc(g.error)}</p>`;
  const hasTarget = !!(SEC.ub.url || "").trim();
  return `${renderUrlBuilder()}
    <section class="card wide">
      <div class="card-head"><h2>Detection payloads</h2></div>
      <p class="report-intro">Benign strings that reveal whether a weakness exists. Read <b>How it works</b> to understand what you’re testing, <b>edit any payload</b> in place to try variations, then <b>Copy</b> it into the field a test names and check <b>Look for</b>. They don’t steal data or run commands — use them only on the QA site, and replace <code>example.org</code> / <code>BURP-URL</code> with your own request-catcher where noted.</p>
      <div class="pl-target">
        <b>Make copyable URLs</b>
        <p class="hint">Set a target page and parameter, and every payload below gets <b>Copy URL</b> and <b>Open ↗</b> — using whatever you’ve typed into that payload, so edit first, then copy. Leave the parameter blank to use the URL’s first one (or <code>?s=</code> for search).</p>
        <div class="row2">
          <label class="field">Target URL<input id="plUrl" value="${esc(SEC.ub.url || "")}" placeholder="https://your-qa-site/?s=test" spellcheck="false" autocomplete="off"></label>
          <label class="field">Parameter<input id="plParam" value="${esc(SEC.ub.refParam || "")}" placeholder="s" spellcheck="false" autocomplete="off"></label>
        </div>
        ${hasTarget ? "" : `<p class="hint">No target set yet — <b>Copy URL</b> / <b>Open</b> will prompt you to fill this in.</p>`}
      </div>
    </section>
    ${g.map((grp) => `<section class="card wide">${payloadBlock(grp)}</section>`).join("")}`;
}

function payloadCopyText(btn) {
  const row = btn.closest(".pl-row");
  const input = row.querySelector(".pl-input");
  if (input) return input.value;
  const code = row.querySelector(".pl-code");
  return code?.dataset.full ?? code?.textContent ?? "";
}

function rowPayload(row) {
  const input = row.querySelector(".pl-input");
  if (input) return input.value;
  const code = row.querySelector(".pl-code");
  return code?.dataset.full ?? code?.textContent ?? "";
}

// Keep each row's "Open ↗" link pointing at the current payload + target, so
// clicking it is a plain link navigation (never popup-blocked).
function refreshOpenLink(row) {
  const a = row.querySelector(".pl-open");
  if (!a) return;
  const url = refUrl(rowPayload(row));
  if (url) { a.href = url; a.classList.remove("disabled"); a.title = url; }
  else { a.removeAttribute("href"); a.classList.add("disabled"); a.title = "Set a target URL at the top of this tab first"; }
}

function bindPayloads(v) {
  const tick = (b, text) => { const t = b.textContent; b.textContent = text; setTimeout(() => (b.textContent = t), 1200); };
  const refreshAll = () => v.querySelectorAll(".pl-row").forEach(refreshOpenLink);
  // The target bar (reference only). Stored live; refresh links on every keystroke.
  const pu = $("#plUrl", v); if (pu) pu.oninput = (e) => { SEC.ub.url = e.target.value; refreshAll(); };
  const pp = $("#plParam", v); if (pp) pp.oninput = (e) => { SEC.ub.refParam = e.target.value; refreshAll(); };
  v.querySelectorAll(".pl-copy").forEach((b) => (b.onclick = async () => {
    try { await navigator.clipboard.writeText(payloadCopyText(b)); tick(b, "Copied"); } catch { tick(b, "Blocked"); }
  }));
  v.querySelectorAll(".pl-input").forEach((inp) => (inp.oninput = () => refreshOpenLink(inp.closest(".pl-row"))));
  v.querySelectorAll(".pl-enc").forEach((b) => (b.onclick = () => {
    const input = b.closest(".pl-row").querySelector(".pl-input");
    if (input) { input.value = encodeURIComponent(input.value); refreshOpenLink(b.closest(".pl-row")); }
  }));
  v.querySelectorAll(".pl-url").forEach((b) => (b.onclick = async () => {
    const url = refUrl(payloadCopyText(b));
    if (!url) return tick(b, "Set URL ↑");
    try { await navigator.clipboard.writeText(url); tick(b, "Copied URL"); } catch { tick(b, "Blocked"); }
  }));
  // Disabled Open link (no target set yet): tell the user instead of doing nothing.
  v.querySelectorAll(".pl-open").forEach((a) => (a.onclick = (e) => { if (!a.getAttribute("href")) { e.preventDefault(); tick(a, "Set URL ↑"); } }));
  refreshAll();
}

// ── Overview, threat model, audit ─────────────────────────────────────────
const STATUS_LABEL = { found: "Issue found", pass: "Passed", partial: "In progress", untested: "Not tested" };
const STATUS_SEV = { found: "critical", pass: "pass", partial: "medium", untested: "low" };
const statusPill = (s) => `<span class="sev-pill ${STATUS_SEV[s]}">${STATUS_LABEL[s]}</span>`;

async function loadStandards() {
  try { SEC.std = await (await fetch("/api/security/standards")).json(); } catch (e) { SEC.std = { error: e.message }; }
  renderSecurity();
}

const TYPE_TAB = { "vuln-scan": "scan", pentest: "checklist", "code-review": "checklist", fuzz: "scan", "threat-model": "threats", audit: "audit", config: "scan" };

function renderOverview() {
  const s = SEC.std;
  if (!s) { loadStandards(); return `<p class="hint">Loading…</p>`; }
  if (s.error) return `<p class="msg bad">${esc(s.error)}</p>`;
  return `<section class="card wide">
      <div class="card-head"><h2>Seven kinds of security testing</h2></div>
      <p class="hint">Where each kind of testing happens on this page, and how far it has got. Scan counts come from the saved reports; manual counts from the checklist.</p>
    </section>
    ${s.types.map((t) => {
      const bits = [];
      if (t.findings != null) bits.push(`<span class="stat-pill ${t.findings ? "confirmed" : ""}">${t.findings} open finding${t.findings === 1 ? "" : "s"}</span>`);
      if (t.manual) bits.push(`<span class="stat-pill ${t.manual.failed ? "confirmed" : ""}">${t.manual.done}/${t.manual.total} manual tests done${t.manual.failed ? ` · ${t.manual.failed} failed` : ""}</span>`);
      if (t.summary) bits.push(`<span class="stat-pill ${t.summary.found ? "confirmed" : ""}">${t.summary.found} with issues · ${t.summary.pass} passed · of ${t.summary.total}</span>`);
      return `<section class="card">
        <div class="card-head"><h2>${esc(t.name)}</h2><button class="btn sm" data-gotab="${TYPE_TAB[t.id]}">Open →</button></div>
        <p class="hint">${esc(t.what)}</p>
        <p style="color:var(--ink-2);font-size:14px">${esc(t.where)}</p>
        <div class="sev-row">${bits.join("")}</div>
      </section>`;
    }).join("")}`;
}

function controlRow(c, kind) {
  const key = `${kind}:${c.id}`;
  const open = SEC.clOpen.has(key);
  const risk = c.risk ? (c.risk >= 6 ? ["High risk", "high"] : c.risk >= 3 ? ["Medium risk", "medium"] : ["Low risk", "low"]) : null;
  return `<article class="finding sev-${STATUS_SEV[c.status]}${open ? " open" : ""}">
    <div class="finding-head" data-ctl="${esc(key)}" role="button" tabindex="0" aria-expanded="${open}">
      <span class="sev-dot ${STATUS_SEV[c.status]}"></span>
      <div class="finding-title">
        <span class="fid">${esc(c.id)}${c.stride ? ` · ${esc(c.stride)}` : ""}</span>
        <b>${esc(c.title || c.name)}</b>
        <div class="finding-sub">${risk ? `<span class="sev-pill ${risk[1]}">${risk[0]} (${c.likelihood}×${c.impact})</span>` : ""}${statusPill(c.status)}
          <span class="hint">${c.findings.length ? `${c.findings.length} scan finding(s) · ` : ""}${c.done}/${c.total} manual tests</span></div>
      </div>
      <svg class="chev" viewBox="0 0 20 20" aria-hidden="true"><path d="M6 8l4 4 4-4" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    ${open ? `<div class="finding-body">
      ${c.actor ? `<dl class="kv"><dt>Who</dt><dd>${esc(c.actor)}</dd><dt>Targets</dt><dd>${esc(c.asset)}</dd><dt>Through</dt><dd>${esc(c.entry)}</dd></dl>` : ""}
      <div class="loc"><b>Scan rules</b> <span class="hint">${(c.rules || []).length ? c.rules.map((r) => `<code>${esc(r)}</code>`).join(" ") : "none: manual only"}</span></div>
      ${c.findings.length ? `<div class="loc"><b>Open findings</b><ul>${c.findings.map((f) => `<li><span class="sev-pill ${f.severity}">${esc(f.severity)}</span> ${secMd(f.title)} <span class="hint">(${esc(f.report)})</span></li>`).join("")}</ul></div>` : ""}
      <div class="loc"><b>Manual tests</b><ul>${c.checks.map((k) => `<li>${k.status ? statusPill({ pass: "pass", fail: "found", na: "partial" }[k.status]).replace(/>[^<]+</, `>${{ pass: "Pass", fail: "Fail", na: "N/A" }[k.status]}<`) : `<span class="stat-pill">to do</span>`} <a href="#/security" data-gocheck="${esc(k.id)}">${esc(k.title)}</a></li>`).join("")}</ul></div>
    </div>` : ""}
  </article>`;
}

function renderThreats() {
  const s = SEC.std;
  if (!s) { loadStandards(); return `<p class="hint">Loading…</p>`; }
  const c = (st) => s.threats.filter((t) => t.status === st).length;
  return `<section class="card wide">
      <div class="card-head"><h2>Threat model: WP Travel Engine booking site</h2><span class="chip">STRIDE</span></div>
      <p class="hint">What could go wrong, ranked by risk (likelihood × impact, each 1–3). Each threat is linked to the scan rules and manual tests that check it, and its status updates as you scan and test. Start at the top.</p>
      <div class="sev-row">${["found", "partial", "pass", "untested"].map((st) => `<span class="sev-pill ${STATUS_SEV[st]}">${c(st)} ${STATUS_LABEL[st]}</span>`).join("")}</div>
    </section>
    <section class="card wide"><div class="findings">${s.threats.map((t) => controlRow(t, "t")).join("")}</div></section>`;
}

function auditMarkdown(s) {
  const row = (c) => `| ${c.id} | ${c.name} | ${STATUS_LABEL[c.status]} | ${c.findings.length} | ${c.done}/${c.total} |`;
  const fails = (list) => list.flatMap((c) => [...c.findings.map((f) => `- **${c.id}** ${f.title} (${f.severity}, ${f.report})`), ...c.checks.filter((k) => k.status === "fail").map((k) => `- **${c.id}** Manual test failed: ${k.title}`)]);
  return [`# Security audit — ${new Date().toISOString().slice(0, 10)}`, "", "## OWASP Top 10 (2021)", "", "| ID | Category | Status | Scan findings | Manual tests |", "| --- | --- | --- | --- | --- |", ...s.owasp.map(row), "",
    "## PCI DSS 4.0 (payment pages)", "", "| Req | Control | Status | Scan findings | Manual tests |", "| --- | --- | --- | --- | --- |", ...s.pci.map(row), "",
    "## Issues", "", ...[...new Set([...fails(s.owasp), ...fails(s.pci)])], ""].join("\n");
}

function renderAudit() {
  const s = SEC.std;
  if (!s) { loadStandards(); return `<p class="hint">Loading…</p>`; }
  const sum = (list) => ["found", "partial", "pass", "untested"].map((st) => `<span class="sev-pill ${STATUS_SEV[st]}">${list.filter((x) => x.status === st).length} ${STATUS_LABEL[st]}</span>`).join("");
  return `<section class="card wide">
      <div class="card-head"><h2>Security audit</h2><button class="btn sm" id="auditCopy">Copy audit report</button><span class="msg" id="auditMsg"></span></div>
      <p class="hint">Each control passes only when every linked manual test passed and no scan finding is open. Run the scans (code + site), work through the manual tests, then copy the report.</p>
    </section>
    <section class="card wide"><div class="card-head"><h2>OWASP Top 10 (2021)</h2></div><div class="sev-row">${sum(s.owasp)}</div>
      <div class="findings">${s.owasp.map((c) => controlRow(c, "o")).join("")}</div></section>
    <section class="card wide"><div class="card-head"><h2>PCI DSS 4.0: payment pages</h2></div>
      <p class="hint">The parts a WordPress site using a hosted/iframe gateway is responsible for (roughly SAQ A / A-EP). The gateway covers the rest.</p><div class="sev-row">${sum(s.pci)}</div>
      <div class="findings">${s.pci.map((c) => controlRow(c, "p")).join("")}</div></section>`;
}

function bindStandards(v) {
  v.querySelectorAll("[data-gotab]").forEach((b) => (b.onclick = () => { SEC.tab = b.dataset.gotab; if (SEC.tab !== "scan" && SEC.tab !== "checklist") SEC.std = null; renderSecurity(); }));
  v.querySelectorAll("[data-ctl]").forEach((h) => (h.onclick = () => { const k = h.dataset.ctl; SEC.clOpen.has(k) ? SEC.clOpen.delete(k) : SEC.clOpen.add(k); renderSecurity(); }));
  v.querySelectorAll("[data-gocheck]").forEach((a) => (a.onclick = (e) => { e.preventDefault(); SEC.tab = "checklist"; SEC.clFilter = "all"; SEC.clOpen.add(a.dataset.gocheck); renderSecurity(); setTimeout(() => v.querySelector(`[data-cl="${a.dataset.gocheck}"]`)?.scrollIntoView({ block: "center" }), 50); }));
  const ac = $("#auditCopy", v);
  if (ac) ac.onclick = async () => { try { await navigator.clipboard.writeText(auditMarkdown(SEC.std)); flash("auditMsg", "Copied as Markdown."); } catch { flash("auditMsg", "Clipboard blocked by the browser.", "bad"); } };
}

function bindChecklist(v) {
  v.querySelectorAll("[data-clf]").forEach((b) => (b.onclick = () => { SEC.clFilter = b.dataset.clf; renderSecurity(); }));
  v.querySelectorAll("[data-cl]").forEach((h) => (h.onclick = () => { const id = h.dataset.cl; SEC.clOpen.has(id) ? SEC.clOpen.delete(id) : SEC.clOpen.add(id); renderSecurity(); }));
  v.querySelectorAll("[data-cls]").forEach((b) => (b.onclick = async () => { await saveCheck(b.dataset.cls, { status: b.dataset.v }); renderSecurity(); }));
  v.querySelectorAll("[data-cln]").forEach((t) => (t.onchange = async () => { await saveCheck(t.dataset.cln, { note: t.value }); renderSecurity(); }));
  v.querySelectorAll("[data-clcopy]").forEach((b) => (b.onclick = async () => {
    const id = b.dataset.clcopy;
    const g = SEC.cl.checklist.find((x) => x.items.some((i) => i.id === id));
    const i = g.items.find((x) => x.id === id);
    const r = SEC.cl.results[id] || {};
    const md = `## ${i.title}\n\n**Area:** ${g.area} (${g.owasp}) · **Found by:** manual security test\n\n**Steps to reproduce**\n${i.steps.map((s, k) => `${k + 1}. ${s}`).join("\n")}\n\n**Expected:** ${i.expected}\n\n**Actual:** ${r.note || "(describe what happened)"}\n`;
    try { await navigator.clipboard.writeText(md); flash(`clm-${id}`, "Copied — paste it into a GitHub issue."); } catch { flash(`clm-${id}`, "Clipboard blocked by the browser.", "bad"); }
  }));
}

async function loadSecurity() {
  try {
    SEC.data = await (await fetch("/api/security")).json();
    if (!SEC.form.site) SEC.form.site = SEC.data.site || "";
    if (!SEC.form.repo && SEC.data.targets[0]) SEC.form.repo = SEC.data.targets[0].value;
    if (!SEC.name && SEC.data.reports[0]) await openSecReport(SEC.data.reports[0].name, false);
    if (SEC.data.scanning && !SEC.busy) { SEC.tab = "scan"; pollSecScan(); }
    if (!SEC.gh) loadGithub();
  } catch (e) { SEC.error = e.message; }
  renderSecurity();
}

async function openSecReport(name, render = true) {
  const body = await (await fetch(`/api/security/report/${encodeURIComponent(name)}`)).json();
  SEC.name = name; SEC.report = body.ok ? body.report : null; SEC.open.clear(); SEC.sevFilter = null;
  if (render) renderSecurity();
}

async function runSecScan() {
  const f = SEC.form;
  const repo = f.repo === "__none" ? "" : f.repo === "__other" ? (f.other || "").trim() : f.repo;
  const site = f.useSite ? f.site.trim() : "";
  if (!repo && !site) { SEC.error = "Choose code to scan, tick “Probe the site”, or both."; return renderSecurity(); }
  SEC.busy = true; SEC.error = ""; renderSecurity();
  try {
    const login = site && f.useUser ? { user: f.user.trim(), pass: f.pass } : {};
    const res = await fetch("/api/security/scan", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ repo, site, deps: !!(repo && f.deps), fuzz: !!(site && f.fuzz), ...login }) });
    const body = await res.json();
    if (!body.ok) throw new Error(body.error);
    pollSecScan();
  } catch (e) { SEC.error = e.message; SEC.busy = false; renderSecurity(); }
}

/** The scan runs on the server; poll until it ends, then open its report. */
async function pollSecScan() {
  SEC.busy = true;
  try {
    const d = await (await fetch("/api/security")).json();
    SEC.data = d;
    if (d.scanning) {
      SEC.progress = d.scanning.log;
      if (S.slug === "security" && SEC.tab === "scan") renderSecurity();
      return setTimeout(pollSecScan, 2500);
    }
    SEC.busy = false; SEC.progress = null; SEC.std = null;
    if (d.last && !d.last.ok) SEC.error = d.last.error;
    else if (d.last?.name) await openSecReport(d.last.name, false);
  } catch (e) { SEC.busy = false; SEC.error = e.message; }
  renderSecurity();
}

function secWhere(f, meta) {
  if (f.file) {
    const label = `<code>${esc(f.file)}:${f.line}</code>`;
    return meta?.repoUrl ? `<a href="${esc(meta.repoUrl)}/blob/${esc(meta.commit || "main")}/${esc(f.file)}#L${f.line}" target="_blank" rel="noopener">${label}</a>` : label;
  }
  return f.url ? `<a href="${esc(f.url)}" target="_blank" rel="noopener"><code>${esc(f.url)}</code></a>` : "";
}

// Detail text is light markdown (`code`, "- " bullets); render just that.
const secMd = (t) => esc(t).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\n- /g, "<br>• ").replace(/\n/g, "<br>");

function renderSecFinding(f, meta) {
  const open = SEC.open.has(f.id);
  return `<article class="finding sev-${f.severity}${open ? " open" : ""}">
    <div class="finding-head" data-sid="${esc(f.id)}" role="button" tabindex="0" aria-expanded="${open}">
      <span class="sev-dot ${f.severity}"></span>
      <div class="finding-title">
        <span class="fid">DOC-${esc(f.id)}${f.cwe ? ` · ${esc(f.cwe)}` : ""}</span>
        <b>${secMd(f.title)}</b>
        <div class="finding-sub">
          <span class="sev-pill ${f.severity}">${esc(f.severity)}</span>
          <span class="stat-pill ${f.status === "new" ? "confirmed" : ""}">${esc(f.status)}</span>
          <span class="tag">${f.file ? "code" : "site"}</span>
          <span class="hint">${esc(f.file ? `${f.file}:${f.line}` : (f.url || "").replace(/^https?:\/\/[^/]+/, ""))}</span>
        </div>
      </div>
      <svg class="chev" viewBox="0 0 20 20" aria-hidden="true"><path d="M6 8l4 4 4-4" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    ${open ? `<div class="finding-body">
      <div class="loc"><b>Where</b> ${secWhere(f, meta)}</div>
      ${f.snippet ? `<pre class="snip">${esc(f.snippet)}</pre>` : ""}
      <p>${secMd(f.detail || "")}</p>
      ${f.impact ? `<p><b>Impact.</b> ${esc(f.impact)}</p>` : ""}
      ${f.repro?.length ? `<div class="steps"><b>How to test it</b><ol>${f.repro.map((s) => `<li>${secMd(s)}</li>`).join("")}</ol></div>` : ""}
      ${f.fix ? `<p class="fix"><b>Suggested fix (for developers).</b> ${secMd(f.fix)}</p>` : ""}
      <div class="actions">
        ${f.issue ? `<a class="btn sm" href="${esc(f.issue.url)}" target="_blank" rel="noopener">Filed #${f.issue.number} ↗</a>` : `<button class="btn sm" data-file="${esc(f.id)}" ${SEC.gh && SEC.gh.repoOk ? "" : "disabled title='Set a writable repo in the GitHub panel on the Automated scan tab'"}>File issue</button>`}
        <button class="btn sm" data-copy="${esc(f.id)}">Copy as issue</button>
        <button class="btn sm danger" data-ignore="${esc(f.id)}" title="Hide this finding now and in later scans">Not a bug</button>
        <span class="msg" id="sm-${esc(f.id)}"></span>
      </div>
    </div>` : ""}
  </article>`;
}

// ── GitHub issue filing ─────────────────────────────────────────────────────
async function loadGithub() {
  try { SEC.gh = await (await fetch("/api/security/github")).json(); } catch (e) { SEC.gh = { ok: false, error: e.message }; }
  if (S.slug === "security") renderSecurity();

async function saveGithub(repo) {

  catch (e) { SEC.gh = { ok: false, error: e.message }; }

}

async function fileIssue(id) {
  const btn = document.querySelector(`[data-file="${id}"]`);
  if (btn) { btn.disabled = true; btn.textContent = "Filing…"; }
  try {
    const r = await (await fetch("/api/security/file-issue", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name: SEC.name, id }) })).json();
    if (!r.ok) throw new Error(r.error);
    SEC.report = r.report;
    flash(`sm-${id}`, r.issue.existed ? `Already filed — #${r.issue.number}` : `Filed #${r.issue.number}`);
    renderSecurity();
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = "File issue"; }
    flash(`sm-${id}`, e.message, "bad");
  }
}

/** Sends JSON to a settings endpoint; returns the body (throws its error). */
async function settingsCall(method, url, body) {
  const res = await fetch(url, { method, headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (!res.ok || data.ok === false) throw Object.assign(new Error(data.error || `HTTP ${res.status}`), { data });
  return data;
}

function flash(id, text, kind = "ok") {
  const el = $(`#${id}`); if (!el) return;

}

    </div>`;

  // Appearance
  $("#view").querySelectorAll("[data-theme-choice]").forEach((b) => (b.onclick = () => setTheme(b.dataset.themeChoice)));

  // Slack connection
  $("#view").querySelectorAll("[data-slack-mode]").forEach((b) => (b.onclick = () => { S.slackMode = b.dataset.slackMode; renderSettings(); }));
  $("#slackForm").onsubmit = async (e) => {
    e.preventDefault();
    const body = mode === "bot"
      ? { mode, botToken: $("#slackToken").value, channel: $("#slackChannel").value }
      : { mode, webhookUrl: $("#slackWebhook").value };
    try { S.settings = await settingsCall("PUT", "/api/slack/connection", body); renderSettings(); flash("slackMsg", "Saved."); }
    catch (err) { flash("slackMsg", err.message, "bad"); }
  };
  const test = $("#slackTest");
  if (test) test.onclick = async () => {
    test.disabled = true; flash("slackMsg", "Sending…", "");
    try { await settingsCall("POST", "/api/slack/test"); flash("slackMsg", "Test message sent — check the channel."); }
    catch (err) { flash("slackMsg", err.message, "bad"); }
    test.disabled = false;
  };
  const remove = $("#slackRemove");
  if (remove) remove.onclick = async () => {
    if (!confirm("Remove the Slack connection saved here? .env values (if any) apply again.")) return;
    try { S.settings = await settingsCall("DELETE", "/api/slack/connection"); S.slackMode = null; renderSettings(); }
    catch (err) { flash("slackMsg", err.message, "bad"); }
  };

  // Automatic report options: saved as soon as they change.
  const saveOpts = async (patch) => {
    try { S.settings = await settingsCall("PUT", "/api/slack/options", patch); flash("notifyMsg", "Saved."); }
    catch (err) { flash("notifyMsg", err.message, "bad"); }
  };
  $("#notifyOn").onchange = (e) => saveOpts({ notifyOn: e.target.value });
  $("#view").querySelectorAll("[data-slack-opt]").forEach((i) => (i.onchange = () => saveOpts({ [i.dataset.slackOpt]: i.checked })));
  $("#view").querySelectorAll("[data-send]").forEach((b) => (b.onclick = async () => {
    b.disabled = true; flash("sendMsg", "Sending…", "");
    try {
      const r = await settingsCall("POST", "/api/slack/send", { slug: b.dataset.send });
      S.settings = r.settings; renderSettings();
      flash("sendMsg", `Report sent (${r.mode}${r.screenshots ? `, ${r.screenshots} screenshot(s)` : ""}).`);
    } catch (err) {
      if (err.data?.settings) { S.settings = err.data.settings; renderSettings(); }
      flash("sendMsg", err.message, "bad");
    }
  }));

  // Schedule
  $("#view").querySelectorAll("[data-day]").forEach((b) => (b.onclick = () => b.setAttribute("aria-pressed", String(b.getAttribute("aria-pressed") !== "true"))));
  $("#schedForm").onsubmit = async (e) => {
    e.preventDefault();
    const body = {
      enabled: $("#schedOn").checked,
      slug: $("#schedSlug").value,
      time: $("#schedTime").value,
      days: [...$("#view").querySelectorAll('[data-day][aria-pressed="true"]')].map((b) => Number(b.dataset.day)),
      cleanup: $("#schedCleanup").checked,
      headed: $("#schedHeaded").checked,
    };
    try { S.settings = await settingsCall("PUT", "/api/schedule", body); renderSettings(); flash("schedMsg", "Schedule saved."); }
    catch (err) { flash("schedMsg", err.message, "bad"); }
  };
}

function renderTodo(meta) {
  const file = `tests/${meta.slug.replace(/^(wptravelengine|wp-travel-engine|wte)-/, "")}.spec.js`;
  $("#view").innerHTML = `
    <header class="head"><div>
      <p class="eyebrow">${esc(meta.group)} · not automated</p>
      <h1>${esc(meta.name)}</h1>
      <p class="lede">${esc(meta.description)}</p>
    </div></header>
    <section class="panel"><div class="blank">
      <h2>No tests for ${esc(meta.name)} yet</h2>
      <p>It shows here so the gap is visible. Once it has a spec, it gets the same feature list, live run, history and fixtures as the automated add-ons.</p>
      <ol>
        <li>Write <code>${esc(file)}</code>. Group tests by area with <code>test.describe("1. Settings")</code>, <code>test.describe("2. Frontend")</code>… Each group becomes a feature group here.</li>
        <li>Point its entry in <code>config/addons.js</code> at the spec:
<pre>{ slug: "${esc(meta.slug)}", name: "${esc(meta.name)}",
  spec: "${esc(file)}", … }</pre></li>
        <li>For a live view, call <code>startLiveFrames(context)</code> from <code>tests/support/liveFrames.js</code> in the spec's <code>beforeAll</code>, then reload this page.</li>
      </ol>
      <p>Use <code>tests/accommodation.spec.js</code> as the model.</p>
    </div></section>`;
}

// ── Running ───────────────────────────────────────────────────────────────
async function startRun(selection) {
  const err = $("#runErr"); if (err) err.textContent = "";
  const d = S.detail[S.slug];
  S.live = {}; S.logs = {}; S.started = {}; S.current = null; S.open.clear(); S.log = []; S.frame = null;
  const ids = selection.length ? selection : d.tests.map((t) => t.id);
  ids.forEach((id) => delete d.results[id]);
  const res = await fetch("/api/run", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ slug: S.slug, selection, live: S.opts.live, headed: S.opts.headed, cleanup: S.opts.cleanup }) });
  const body = await res.json().catch(() => ({ ok: false, error: "The runner did not answer." }));
  if (!body.ok) { if ($("#runErr")) $("#runErr").textContent = body.error; return; }
  S.run = body.state;
  go(S.slug, "run");
  if (S.tab === "run") renderStage();
}

// The line reporter prints "[n/N] … › Group › Title" when a test STARTS and
// "  n) … › Group › Title" when one FAILS. Lines in between belong to the test
// that is running; a start also means the one before it passed, unless it was
// reported failed.
function idFromLine(l) {
  const m = l.match(/\.spec\.[jt]s:\d+:\d+\s*›\s*(.+?)\s*$/);
  if (!m) return null;
  const parts = m[1].split(" › ");
  return parts.length > 1 ? `${parts[0]} › ${parts.slice(1).join(" › ")}` : `Tests › ${parts[0]}`;
}
let paint = null;
const repaint = () => { if (!paint) paint = requestAnimationFrame(() => { paint = null; if (S.tab === "run" && S.run.slug === S.slug) renderPanel(); else if (S.tab === "features") renderPanel(); renderCatalog(); }); };
function onLog(line) {
  S.log.push(line); if (S.log.length > 5000) S.log.shift();
  const pre = $("#log");
  if (pre && S.run.slug === S.slug) {
    const stick = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 40;
    if (pre.firstElementChild?.textContent?.startsWith("Output appears")) pre.innerHTML = "";
    pre.insertAdjacentHTML("beforeend", (pre.childElementCount ? "\n" : "") + `<span class="${lineClass(line)}">${esc(line)}</span>`);
    if (stick) pre.scrollTop = pre.scrollHeight;
    const c = $("#logCount"); if (c) c.textContent = `${S.log.length} lines`;
  }
  if (/^\[\d+\/\d+\]/.test(line)) {
    const id = idFromLine(line);
    if (S.current && S.live[S.current] === "running") S.live[S.current] = "passed";
    if (id) { S.live[id] = "running"; S.current = id; S.started[id] = Date.now(); S.logs[id] = []; }
    return repaint();
  }
  if (/^\s*\d+\)\s/.test(line)) {
    const id = idFromLine(line);
    if (id) { S.live[id] = "failed"; S.open.add(id); (S.logs[id] ||= []).push(line); S.current = id; return repaint(); }
  }
  if (/^\[\w+\] ›/.test(line)) return;
  if (/^■ finished/.test(line)) { if (S.current && S.live[S.current] === "running" && /passed/.test(line)) S.live[S.current] = "passed"; return repaint(); }
  if (S.current) (S.logs[S.current] ||= []).push(line);
}
setInterval(() => { if (S.run.running && S.tab === "run" && S.run.slug === S.slug) {
  // Durations tick; the route re-renders cheaply. Keep the log scroll position.
  const pre = $("#log"); const top = pre?.scrollTop;
  renderPanel(); const p2 = $("#log"); if (p2 && top != null) p2.scrollTop = top >= (pre.scrollHeight - pre.clientHeight - 40) ? p2.scrollHeight : top;
} }, 2000);

function onFrame(f) {
  S.frame = f;
  if (S.tab !== "run" || f.slug !== S.slug || !S.opts.live) return;
  const img = $("#vpImg");
  if (img) {
    // Swap only once the next frame has loaded, so the view never flashes.
    const next = new Image();
    next.onload = () => { img.src = next.src; };
    next.src = `/api/live/${f.slug}.jpg?t=${f.at}`;
    const url = $("#vpUrl"); if (url) url.textContent = f.url;
  } else renderPanel();
}

// ── boot ──────────────────────────────────────────────────────────────────
function connect() {
  const es = new EventSource("/api/stream");
  es.onopen = () => { $("#conn").className = "pulse on"; };
  es.onerror = () => { $("#conn").className = "pulse warn"; };
  es.addEventListener("log", (e) => onLog(JSON.parse(e.data)));
  es.addEventListener("frame", (e) => onFrame(JSON.parse(e.data)));
  es.addEventListener("status", (e) => {
    const prev = S.run; S.run = JSON.parse(e.data);
    if (S.run.running && !prev.running) { S.log = []; S.live = {}; S.logs = {}; S.current = null; }
    renderStage(); renderCatalog();
  });
  es.addEventListener("addon", async (e) => {
    const d = JSON.parse(e.data);
    S.detail[d.slug] = d;
    S.live = {};
    Object.entries(d.results).forEach(([id, r]) => r.status === "failed" && S.open.add(id));
    const c = await (await fetch("/api/catalog")).json();
    S.catalog = c; renderCatalog(); if (S.slug === d.slug) renderStage();
    // The Slack report goes out a moment after the run ends; refresh twice.
    if (S.slug === "settings") { loadSettings(); setTimeout(loadSettings, 5000); }
  });
}
(async () => {
  const c = await (await fetch("/api/catalog")).json();
  S.catalog = c; S.site = c.site; S.run = c.state;
  if (c.site) { $("#siteText").textContent = c.site.replace(/^https?:\/\//, "").replace(/\/$/, ""); $("#site").href = c.site; }
  (c.log || []).forEach(onLog);
  route();
  connect();
})();
</script>
